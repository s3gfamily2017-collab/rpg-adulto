<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA</title>
    <style>
        body { background: #0d0614; color: #f3e6ff; font-family: sans-serif; text-align: center; padding: 15px; }
        .painel { background: #251438; border: 1px solid #3d2353; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .box { background: #1a0f26; border: 2px solid #3d2353; padding: 20px; border-radius: 16px; margin-bottom: 15px; }
        .relogio { font-size: 32px; font-weight: bold; color: #d4af37; margin: 10px 0; }
        .card { background: #2a163d; border: 2px solid #d4af37; padding: 15px; border-radius: 12px; margin-top: 15px; font-style: italic; }
        button { background: #8a184e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 5px; width: 90%; max-width: 300px; }
        .btn-pequeno { width: auto; padding: 5px 15px; background: #3d2353; font-size: 14px; }
    </style>
</head>
<body>

    <h2>AURA: Kama Play</h2>

    <!-- Pontuação Prática -->
    <div class="painel">
        <p>Anfitrião: <span id="v1">0</span> | Convidado: <span id="v2">0</span></p>
        <button class="btn-pequeno" onclick="document.getElementById('v1').innerText = parseInt(document.getElementById('v1').innerText)+1">Anfitrião +1</button>
        <button class="btn-pequeno" onclick="document.getElementById('v2').innerText = parseInt(document.getElementById('v2').innerText)+1">Convidado +1</button>
    </div>

    <!-- Temporizador Prático -->
    <div class="painel">
        <div class="relogio" id="tempo-texto">02:00</div>
        <button class="btn-pequeno" onclick="ligarCronometro()">Iniciar</button>
        <button class="btn-pequeno" onclick="pararCronometro()">Pausar</button>
    </div>

    <!-- Texto e Conteúdo Principal -->
    <div class="box">
        <p id="narracao">Bem-vindos ao AURA. Escolham um local confortável e com pouca luz. Decidam quem assume o papel de Anfitrião e quem será o Convidado.</p>
        <div id="bloco-kama"></div>
    </div>

    <!-- Botões de Ação -->
    <div id="bloco-botoes">
        <button onclick="mudarFase(1)">Papéis Definidos: Começar Jogo</button>
    </div>

    <script>
        var faseAtual = 0;
        var segundos = 120;
        var relogioRodando = null;

        var posicoes = [
            "✨ A União de Lótus: Sentem-se frente a frente com as pernas entrelaçadas. Foquem-se no olhar e sincronizem a respiração.",
            "✨ A Flecha de Cupido: Uma variação deitada que oferece estabilidade. Um dita o ritmo milimetricamente, enquanto o outro foca apenas nas sensações recebidas.",
            "✨ O Triângulo de Vénus: Utilizem almofadas para elevar a anca e criar novos ângulos. Esta variação maximiza o contacto pele com pele.",
            "✨ A Balança Secreta: Uma posição que exige cooperação mútua à beira da cama. O foco aqui é o equilíbrio e a comunicação verbal.",
            "✨ O Abraço de Bambu: Uma variação vertical ou semi-inclinada onde os corpos se fundem. Ideal para carícias lentas no pescoço.",
            "✨ A Estrela Cadente: Uma rotação suave de ângulos na cama. Permite que ambos explorem o toque nas pernas e abdómen."
        ];

        function mudarFase(num) {
            faseAtual = num;
            var txt = document.getElementById("narracao");
            var bts = document.getElementById("bloco-botoes");
            var kama = document.getElementById("bloco-kama");
            
            kama.innerHTML = "";
            pararCronometro();

            if (faseAtual == 1) {
                txt.innerText = "O clima está definido. O Anfitrião assume o comando e deve escolher a atmosfera inicial para o casal:";
                segundos = 120;
                atualizarTextoTempo();
                bts.innerHTML = '<button onclick="mudarFase(2)">🔥 Toque e Sensação (Massagens)</button><button onclick="mudarFase(3)">💬 Confissões (Fantasias)</button>';
            }
            else if (faseAtual == 2) {
                txt.innerText = "O Anfitrião ganhou o direito a receber uma massagem relaxante do Convidado nas costas ou ombros. Ativem o cronómetro abaixo.";
                segundos = 120;
                atualizarTextoTempo();
                bts.innerHTML = '<button onclick="mudarFase(4)">Avançar para o Kamasutra</button>';
            }
            else if (faseAtual == 3) {
                txt.innerText = "Hora da verdade. O Convidado deve revelar uma fantasia secreta ou um desejo que nunca confessou antes. O Anfitrião ouve atentamente.";
                segundos = 120;
                atualizarTextoTempo();
                bts.innerHTML = '<button onclick="mudarFase(4)">Avançar para o Kamasutra</button>';
            }
            else if (faseAtual == 4) {
                txt.innerText = "Os corpos e as mentes estão sintonizados. Explorem a posição sugerida abaixo sem pressas. Concentrem-se na entrega mútua.";
                segundos = 180; // 3 minutos
                atualizarTextoTempo();
                
                var sorteada = posicoes[Math.floor(Math.random() * posicoes.length)];
                kama.innerHTML = '<div class="card">' + sorteada + '</div>';
                
                bts.innerHTML = '<button onclick="mudarFase(4)">🔄 Sortear Outra Posição</button><button onclick="mudarFase(5)">👑 Concluir Rodada</button>';
            }
            else if (faseAtual == 5) {
                txt.innerText = "A rodada terminou com sucesso! Parabéns pela ligação construída esta noite. Quem acumulou mais pontos pode escolher a próxima fantasia real.";
                segundos = 60;
                atualizarTextoTempo();
                bts.innerHTML = '<button onclick="mudarFase(1)">🔄 Jogar Novamente</button>';
            }
        }

        function ligarCronometro() {
            if (relogioRodando != null) return;
            relogioRodando = setInterval(function() {
                if (segundos > 0) {
                    segundos--;
                    atualizarTextoTempo();
                } else {
                    pararCronometro();
                    alert("✨ Tempo esgotado! Concluam a ação ou passem ao próximo passo.");
                }
            }, 1000);
        }

        function pararCronometro() {
            clearInterval(relogioRodando);
            relogioRodando = null;
        }

        function atualizarTextoTempo() {
            var min = Math.floor(segundos / 60);
            var sec = segundos % 60;
            if (min < 10) min = "0" + min;
            if (sec < 10) sec = "0" + sec;
            document.getElementById("tempo-texto").innerText = min + ":" + sec;
        }
    </script>

</body>
</html>
