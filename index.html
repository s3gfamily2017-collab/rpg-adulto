<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AURA</title>
    <style>
        :root { 
            --bg: #0d0614; 
            --panel: #1a0f26; 
            --accent: #d4af37; 
            --magenta: #8a184e; 
            --text: #f3e6ff; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            box-sizing: border-box; 
            text-align: center;
        }
        h2 { color: var(--accent); margin: 10px 0 5px 0; letter-spacing: 1px; }
        
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #251438;
            border: 1px solid #3d2353;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .player-score { text-align: center; font-size: 14px; }
        .score-box { font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 4px; display: flex; align-items: center; gap: 10px; }
        .score-btn { background: var(--magenta); border: none; color: white; border-radius: 5px; width: 28px; height: 28px; font-size: 18px; cursor: pointer; }

        .box { 
            background: var(--panel); 
            border: 2px solid #3d2353; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); 
            line-height: 1.6; 
            font-size: 16px;
        }

        .timer-container {
            background: #201230;
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .timer-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .timer-controls button {
            background: var(--magenta);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin: 0 4px;
        }
        
        .kama-card { 
            background: linear-gradient(135deg, #2a163d 0%, #1a0f26 100%); 
            border: 2px solid var(--accent); 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 15px;
        }
        .kama-title { color: var(--accent); font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .kama-desc { font-style: italic; font-size: 14px; color: #e1ccec; }
        
        .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button.action-btn { 
            background: linear-gradient(135deg, var(--magenta) 0%, #610f36 100%); 
            color: #fff; 
            border: 1px solid #b3246b; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 500; 
            cursor: pointer; 
            text-align: center; 
        }
        .footer-tag { font-size: 10px; color: #69527d; text-transform: uppercase; letter-spacing: 2px; margin-top: auto; padding-top: 15px; }
    </style>
</head>
<body>

    <h2>AURA: Kama Play</h2>

    <!-- Placar Superior -->
    <div class="scoreboard">
        <div class="player-score">
            <div>Anfitrião</div>
            <div class="score-box">
                <button class="score-btn" onclick="mudarPontos('p1', -1)">-</button>
                <span id="score-p1">0</span>
                <button class="score-btn" onclick="mudarPontos('p1', 1)">+</button>
            </div>
        </div>
        <div class="player-score">
            <div>Convidado</div>
            <div class="score-box">
                <button class="score-btn" onclick="mudarPontos('p2', -1)">-</button>
                <span id="score-p2">0</span>
                <button class="score-btn" onclick="mudarPontos('p2', 1)">+</button>
            </div>
        </div>
    </div>

    <!-- Relógio -->
    <div class="timer-container">
        <div class="timer-display" id="timer-num">02:00</div>
        <div class="timer-controls">
            <button onclick="startTimer()">Iniciar</button>
            <button onclick="pauseTimer()">Pausar</button>
        </div>
    </div>

        <div id="zona-kamasutra"></div>
    </div>

    <!-- Zona de Opções -->
    <div class="choices" id="zona-botoes">
        <button class="action-btn" onclick="irPara('fase_inicial')">Papéis Definidos: Começar Jogo</button>
    </div>

    <div class="footer-tag">+18 • Uso Privado • Kamasutra Roleplay</div>

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(function() {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-num').innerText = formatTime(timeLeft);
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("Tempo esgotado!");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function formatTime(secs) {
            var m = Math.floor(secs / 60).toString().padStart(2, '0');
            var s = (secs % 60).toString().padStart(2, '0');
            return m + ":" + s;
        }
