<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AURA: Kama Play</title>
    
    <style>
        :root { 
            --bg: #0d0614; 
            --panel: #1a0f26; 
            --accent: #d4af37; 
            --magenta: #8a184e; 
            --text: #f3e6ff; 
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            box-sizing: border-box; 
            text-align: center;
        }
        h2 { color: var(--accent); margin: 10px 0 5px 0; letter-spacing: 1px; }
        
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #251438;
            border: 1px solid #3d2353;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .player-score { text-align: center; font-size: 14px; }
        .score-box { font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 4px; display: flex; align-items: center; gap: 10px; }
        .score-btn { background: var(--magenta); border: none; color: white; border-radius: 5px; width: 28px; height: 28px; font-size: 18px; cursor: pointer; }

        .box { 
            background: var(--panel); 
            border: 2px solid #3d2353; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); 
            line-height: 1.6; 
            font-size: 16px;
        }

        .timer-container {
            background: #201230;
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .timer-display {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }
        .timer-controls button {
            background: var(--magenta);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin: 0 4px;
        }
        
        .kama-card { 
            background: linear-gradient(135deg, #2a163d 0%, #1a0f26 100%); 
            border: 2px solid var(--accent); 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 15px;
        }
        .kama-title { color: var(--accent); font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .kama-desc { font-style: italic; font-size: 14px; color: #e1ccec; }
        
        .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button.action-btn { 
            background: linear-gradient(135deg, var(--magenta) 0%, #610f36 100%); 
            color: #fff; 
            border: 1px solid #b3246b; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 500; 
            cursor: pointer; 
            text-align: center; 
        }
        button.action-btn:hover { filter: brightness(1.2); }
        .footer-tag { font-size: 10px; color: #69527d; text-transform: uppercase; letter-spacing: 2px; margin-top: auto; padding-top: 15px; }
    </style>

    <script>
        let scores = { p1: 0, p2: 0 };
        let timerInterval = null;
        let timeLeft = 120;

        const posicoesKamasutra = [
            { title: "A União de Lótus", desc: "Uma posição de conexão profunda. Sentem-se frente a frente com as pernas entrelaçadas. Foquem-se no olhar e sincronizem a respiração." },
            { title: "A Flecha de Cupido", desc: "Uma variação deitada que oferece estabilidade. Um dita o ritmo milimetricamente, enquanto o outro foca apenas nas sensações recebidas." },
            { title: "O Triângulo de Vénus", desc: "Utilizem almofadas para elevar a anca e create novos ângulos. Esta variação maximiza o contacto pele com pele." },
            { title: "A Balança Secreta", desc: "Uma posição que exige cooperação mútua à beira da cama. O foco aqui é o equilíbrio e a comunicação verbal." },
            { title: "O Abraço de Bambu", desc: "Uma variação vertical ou semi-inclinada onde os corpos se fundem. Ideal para carícias lentas no pescoço." },
            { title: "A Estrela Cadente", desc: "Uma rotação suave de ângulos na cama. Permite que ambos explorem o toque nas pernas e abdómen." }
        ];

        const caminhos = {
            fase_inicial: {
                text: "O clima está definido. O Anfitrião assume o comando e deve escolher a atmosfera inicial para o casal:",
                time: 120,
                choices: [
                    { text: "🔥 Toque e Sensação (Massagem e Provocação)", next: "caminho_toque" },
                    { text: "💬 Confissões e Segredos (Diálogo e Fantasias)", next: "caminho_segredos" }
                ]
            },
            caminho_toque: {
                text: "O Anfitrião ganhou o direito a receber uma massagem relaxante do Convidado nas costas ou ombros. Ativem o cronómetro abaixo para acompanhar.",
                time: 120,
                choices: [
                    { text: "Usar óleo de massagem (+1 Ponto Convidado)", next: "kamasutra_fase_1", score: 'p2' },
                    { text: "Fazer com os olhos vendados (+1 Ponto Anfitrião)", next: "kamasutra_fase_1", score: 'p1' }
                ]
            },
            caminho_segredos: {
                text: "Hora da verdade. O Convidado deve revelar uma fantasia secreta ou um desejo que nunca confessou antes. O Anfitrião ouve atentamente.",
                time: 120,
                choices: [
                    { text: "Fantasia revelada! Avançar para intimidade", next: "kamasutra_fase_1", score: 'p2' },
                    { text: "Pedir para mudar de desafio (Mudar para Massagem)", next: "caminho_toque" }
                ]
            },
            kamasutra_fase_1: {
                text: "Os corpos e as mentes estão sintonizados. Chegou o momento de consultar o conhecimento ancestral do Kamasutra. Prontos para sortear o vosso primeiro desafio físico?",
                time: 60,
                choices: [
                    { text: "🔮 Sortear Posição do Kamasutra", next: "sortear_kama" }
                ]
            },
            sortear_kama: {
                text: "Explorem a posição sugerida abaixo sem pressas. Concentrem-se na entrega mútua. O cronómetro foi configurado para 3 minutos.",
                isKamaNode: true,
                time: 180,
                choices: [
                    { text: "🔄 Sortear Outra Posição", next: "sortear_kama" },
                    { text: "👑 Concluir Rodada (Somar Pontos)", next: "fim_rodada" }
                ]
            },
            fim_rodada: {
                text: "A rodada terminou com sucesso! Parabéns pela ligação construída esta noite. Quem acumulou mais pontos pode escolher a próxima fantasia da vida real.",
                time: 60,
                choices: [
                    { text: "🔄 Jogar Novamente (Reiniciar)", next: "fase_inicial" }
                ]
            }
        };

        // --- AQUI COMEÇA O CÓDIGO DA SUA IMAGEM ADAPTADO ---
        function mudarPontos(player, val) {
            scores[player] = Math.max(0, scores[player] + val);
            document.getElementById('score-' + player).innerText = scores[player];
        }

        function irPara(nomeDoCaminho) {
            var nodo = caminhos[nomeDoCaminho];
            if (!nodo) return;

            pauseTimer();
            timeLeft = nodo.time || 120;
            document.getElementById('timer-num').innerText = formatTime(timeLeft);
            document.getElementById('texto-narrativo').innerText = nodo.text;
            
            var zonaKama = document.getElementById('zona-kamasutra');
            if (zonaKama) zonaKama.innerHTML = '';

            if (nodo.isKamaNode && zonaKama) {
                var pos = posicoesKamasutra[Math.floor(Math.random() * posicoesKamasutra.length)];
                zonaKama.innerHTML = '<div class="kama-card"><div class="kama-title">✨ ' + pos.title + '</div><div class="kama-desc">"' + pos.desc + '"</div></div>';
            }

            var zonaBotoes = document.getElementById('zona-botoes');
            if (!zonaBotoes) return;
            zonaBotoes.innerHTML = '';

            nodo.choices.forEach(function(opcao) {
                var botao = document.createElement('button');
                botao.className = 'action-btn';
                botao.innerText = opcao.text;
                botao.onclick = function() {
                    if (opcao.score) mudarPontos(opcao.score, 1);
                    irPara(opcao.next);
                };
                zonaBotoes.appendChild(botao);
            });
        }
        // --- FIM DO BLOCO DA IMAGEM ---

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(function() {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-num').innerText = formatTime(timeLeft);
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("✨ Tempo esgotado! Concluam a ação ou passem ao próximo passo.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }
